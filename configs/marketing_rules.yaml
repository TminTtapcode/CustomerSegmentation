  "non_buyer_tiering_rules": {
    "HIGH_INTENT": {
      "condition": "(cart_sessions_30d >= 1 OR carts_30d >= 1) AND (sessions_30d >= 2 OR views_30d >= 5)",
      "description": "Active in last 30 days with demonstrated cart addition; strong candidate for checkout assistance.",
      "recommended_tactic": "TAC_CART_RECOVERY",
      "alternative_tactic": "TAC_PRODUCT_EDU"
    },
    "EXPLORING": {
      "condition": "(sessions_30d >= 2 OR views_30d >= 5) AND (cart_sessions_30d == 0 AND carts_30d == 0)",
      "description": "Active browsing across multiple items without carting; candidate for product education and starter kits.",
      "recommended_tactic": "TAC_PRODUCT_EDU",
      "alternative_tactic": "TAC_LOW_COST_NURTURE"
    },
    "LOW_ENGAGEMENT": {
      "condition": "sessions_30d >= 1 AND sessions_30d < 2 AND views_30d < 5 AND (cart_sessions_30d == 0 AND carts_30d == 0)",
      "description": "Single brief visit in last 30 days without cart intent; candidate for low-cost passive newsletter.",
      "recommended_tactic": "TAC_LOW_COST_NURTURE",
      "alternative_tactic": "TAC_NO_ACTION"
    },
    "INACTIVE": {
      "condition": "sessions_30d == 0",
      "description": "No sessions in last 30 days; suppress marketing outreach to prevent spam fatigue and budget waste.",
      "recommended_tactic": "TAC_NO_ACTION",
      "alternative_tactic": "TAC_LOW_COST_NURTURE"
    }
  },

  "guardrails": [
    {
      "guardrail_id": "G1_EXECUTION_CONSENT_CHECK",
      "rule": "Set execution_eligibility = 'PENDING_CONSENT' for all generated recommendations.",
      "rationale": "REES46 dataset does not record explicit user marketing opt-in or privacy consent. Recommendations must not be dispatched automatically without enterprise consent confirmation."
    },
    {
      "guardrail_id": "G2_DATA_QUALITY_FALLBACK",
      "rule": "IF user_id IS NULL OR user_id == '' THEN route to TAC_NO_ACTION with reason INSUFFICIENT_DATA.",
      "rationale": "Corrupt or unidentified visitor records must not receive marketing actions."
    },
    {
      "guardrail_id": "G3_BUDGET_PROTECTION_DEEP_DORMANT",
      "rule": "IF cohort == 'BUYER' AND recency_days > 90 AND monetary < 20.0 AND sessions_30d == 0 THEN suppress to TAC_NO_ACTION.",
      "rationale": "Outreach costs on deep-dormant, single-item low-value purchasers ($< $20) typically exceed expected return."
    },
    {
      "guardrail_id": "G4_CART_INTENT_PRECEDENCE",
      "rule": "IF cart_sessions_30d >= 1 THEN TAC_CART_RECOVERY takes precedence over generic educational or newsletter tactics.",
      "rationale": "Active shopping cart addition in the last 30 days represents the strongest immediate purchase signal across all customer cohorts."
    },
    {
      "guardrail_id": "G5_CONTACT_FATIGUE_PREVENTION",
      "rule": "IF cohort == 'NON_BUYER' AND sessions_30d == 0 THEN route to TAC_NO_ACTION.",
      "rationale": "Over 70% of non-buyers have not visited for over 30 days; mass cold emailing leads to high spam complaint rates."
    }
  ]
}

