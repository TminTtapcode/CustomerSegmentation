{
  "ruleset_version": "v1.0.0",
  "ruleset_name": "Evidence-Based Prescriptive Marketing Decision Ruleset",
  "created_at": "2026-11-09T16:45:00Z",
  "observation_cutoff": "2020-02-01T00:00:00Z",
  "compatible_model_version": "v1.0.0-f1-std-k4",
  "description": "Ruleset for generating explainable marketing recommendations from customer behavioral evidence and segment profiles. All recommendations are research proposals with execution eligibility pending consent verification.",
  
  "marketing_goals": {
    "RETAIN_HIGH_VALUE": {
      "id": "RETAIN_HIGH_VALUE",
      "name_en": "Retain High-Value Customers",
      "name_vi": "Bảo tồn & Gắn kết Khách hàng Giá trị Cao",
      "description": "Protect the highest revenue-generating customer relationships through proactive recognition, exclusive privileges, and personalized loyalty engagement.",
      "primary_kpi": "vip_retention_rate",
      "secondary_kpi": "vip_average_order_value",
      "limitations": "High-touch incentives must not erode gross margin; requires existing brand affinity."
    },
    "ENCOURAGE_REPEAT_PURCHASE": {
      "id": "ENCOURAGE_REPEAT_PURCHASE",
      "name_en": "Encourage Repeat Purchase",
      "name_vi": "Kích thích Đơn hàng Mua Lặp lại Tiếp theo",
      "description": "Accelerate customer transition from single-time or occasional buyers into recurring repeat shoppers through relevant product recommendations and satisfaction checks.",
      "primary_kpi": "repeat_purchase_rate_60d",
      "secondary_kpi": "time_between_purchases_days",
      "limitations": "Timing must align with product replenishment cycles (cosmetics typically 30-60 days)."
    },
    "REENGAGE_INACTIVE": {
      "id": "REENGAGE_INACTIVE",
      "name_en": "Re-engage At-Risk / Inactive Customers",
      "name_vi": "Tái Kích hoạt Khách hàng Đang Hạ nhiệt / Nguy cơ Rời bỏ",
      "description": "Win back customers who previously demonstrated substantial spending or purchase frequency but have ceased activity over the last 30-60 days.",
      "primary_kpi": "reactivation_session_rate",
      "secondary_kpi": "winback_conversion_rate",
      "limitations": "Risk of high communication fatigue if customers left due to poor product satisfaction."
    },
    "SUPPORT_CART_COMPLETION": {
      "id": "SUPPORT_CART_COMPLETION",
      "name_en": "Support Cart Completion",
      "name_vi": "Hỗ trợ Hoàn tất Giỏ hàng & Tháo gỡ Rào cản Thanh toán",
      "description": "Assist users with active product intent who added items to cart in the last 30 days but have not completed checkout.",
      "primary_kpi": "cart_to_purchase_conversion_rate",
      "secondary_kpi": "checkout_abandonment_reduction",
      "limitations": "In-session discounts risk training shoppers to delay checkout intentionally (coupon hunting)."
    },
    "INCREASE_PRODUCT_DISCOVERY": {
      "id": "INCREASE_PRODUCT_DISCOVERY",
      "name_en": "Increase Product Discovery",
      "name_vi": "Kích thích Tìm hiểu & Khám phá Danh mục Sản phẩm",
      "description": "Guide engaged users who browse multiple products without carting toward high-converting categories, starter bundles, and social proof.",
      "primary_kpi": "product_detail_view_depth",
      "secondary_kpi": "first_time_cart_rate",
      "limitations": "Information overload if content is generic rather than category-specific."
    },
    "LOW_COST_NURTURE": {
      "id": "LOW_COST_NURTURE",
      "name_en": "Low-Cost Brand Nurturing",
      "name_vi": "Duy trì Hiện diện Thương hiệu Chi phí Thấp",
      "description": "Maintain low-frequency, high-efficiency brand awareness for occasional visitors and low-spend dormant users through content newsletters.",
      "primary_kpi": "newsletter_open_rate",
      "secondary_kpi": "passive_unsubscribe_rate",
      "limitations": "Low conversion yields; must strictly control delivery cost per contact."
    },
    "NO_ACTION": {
      "id": "NO_ACTION",
      "name_en": "No Action / Holdout Suppression",
      "name_vi": "Không Can thiệp Tiếp thị / Giữ Khoảng cách Tiếp xúc",
      "description": "Explicitly refrain from marketing outreach to preserve customer goodwill, avoid spam fatigue, or protect budget when evidence is insufficient.",
      "primary_kpi": "unsolicited_contact_rate",
      "secondary_kpi": "budget_wastage_avoided",
      "limitations": "Does not generate incremental revenue; acts purely as a cost and fatigue safeguard."
    }
  },

